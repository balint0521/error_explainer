<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
  <title>Error Explainer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--vscode-font-family, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: 13px;
      background: var(--vscode-editor-background, #1e1e1e);
      color: var(--vscode-editor-foreground, #d4d4d4);
      padding: 20px;
      line-height: 1.6;
      max-width: 660px;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 20px;
      opacity: 0.9;
      letter-spacing: 0.2px;
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--vscode-descriptionForeground, #858585);
      margin-bottom: 5px;
    }

    textarea {
      width: 100%;
      background: var(--vscode-input-background, #3c3c3c);
      color: var(--vscode-input-foreground, #cccccc);
      border: 1px solid var(--vscode-input-border, #454545);
      border-radius: 3px;
      padding: 8px 10px;
      font-family: var(--vscode-editor-font-family, 'Courier New', monospace);
      font-size: 12px;
      resize: vertical;
      outline: none;
      line-height: 1.5;
      transition: border-color 0.1s;
    }

    textarea:focus {
      border-color: var(--vscode-focusBorder, #007acc);
    }

    #code { min-height: 90px; }
    #error-msg {
      min-height: 60px;
      font-family: var(--vscode-font-family, sans-serif);
      font-size: 13px;
    }

    #btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 9px;
      background: var(--vscode-button-background, #0e639c);
      color: var(--vscode-button-foreground, #ffffff);
      border: none;
      border-radius: 3px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    #btn:hover:not(:disabled) { background: var(--vscode-button-hoverBackground, #1177bb); }
    #btn:disabled { opacity: 0.5; cursor: default; }

    .hint {
      font-size: 11px;
      color: var(--vscode-descriptionForeground, #858585);
      text-align: center;
      margin-top: 7px;
      opacity: 0.75;
    }

    #output {
      display: none;
      margin-top: 22px;
      border-top: 1px solid var(--vscode-panel-border, #3c3c3c);
      padding-top: 18px;
    }

    .out-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--vscode-descriptionForeground, #858585);
      margin-bottom: 10px;
    }

    /* Explanation body */
    .explanation { font-size: 13px; line-height: 1.75; }

    .explanation p { margin-bottom: 10px; }
    .explanation p:last-child { margin-bottom: 0; }

    .explanation strong {
      color: var(--vscode-textLink-foreground, #4fc3f7);
      font-weight: 600;
    }

    .explanation pre {
      background: var(--vscode-textCodeBlock-background, #1a1a1a);
      border: 1px solid var(--vscode-panel-border, #3c3c3c);
      border-radius: 3px;
      padding: 10px 12px;
      margin: 10px 0;
      overflow-x: auto;
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 12px;
      line-height: 1.5;
    }

    .explanation code {
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 12px;
      background: var(--vscode-textCodeBlock-background, #1a1a1a);
      padding: 1px 4px;
      border-radius: 2px;
    }

    .explanation pre code { background: none; padding: 0; }

    /* Error box */
    .err-box {
      background: var(--vscode-inputValidation-errorBackground, #5a1d1d);
      border-left: 3px solid var(--vscode-inputValidation-errorBorder, #f14c4c);
      padding: 12px 14px;
      border-radius: 0 3px 3px 0;
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <h1>Error Explainer</h1>

  <div class="field">
    <label>Code (optional)</label>
    <textarea id="code" placeholder="Paste your code here, or select it in the editor before opening this panel…"></textarea>
  </div>

  <div class="field">
    <label>Error Message *</label>
    <textarea id="error-msg" placeholder="Paste the error or exception message here…"></textarea>
  </div>

  <button id="btn" onclick="explain()">Explain Error</button>
  <p class="hint">Tip: press Cmd+Enter (macOS) or Ctrl+Enter to submit</p>

  <div id="output">
    <div class="out-label">Explanation</div>
    <div id="content"></div>
  </div>

  <script>
    const vscode = acquireVsCodeApi();

    // Tell the extension the webview is ready so it can send pre-selected code
    window.addEventListener('DOMContentLoaded', function () {
      vscode.postMessage({ command: 'ready' });
    });

    // Handle messages from the extension
    window.addEventListener('message', function (event) {
      var msg = event.data;

      if (msg.type === 'init') {
        if (msg.code) {
          document.getElementById('code').value = msg.code;
        }
        return;
      }

      // Re-enable the button
      var btn = document.getElementById('btn');
      btn.disabled = false;
      btn.textContent = 'Explain Error';

      var output = document.getElementById('output');
      var content = document.getElementById('content');
      output.style.display = 'block';

      if (msg.type === 'result') {
        content.innerHTML = '<div class="explanation">' + md(msg.text) + '</div>';
      } else if (msg.type === 'error') {
        content.innerHTML = '<div class="err-box">' + esc(msg.text) + '</div>';
      }
    });

    function explain() {
      var code = document.getElementById('code').value;
      var error = document.getElementById('error-msg').value.trim();

      if (!error) {
        document.getElementById('error-msg').focus();
        return;
      }

      var btn = document.getElementById('btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Thinking…';

      document.getElementById('output').style.display = 'none';

      vscode.postMessage({ command: 'explain', code: code, error: error });
    }

    // Keyboard shortcut: Cmd/Ctrl + Enter to submit
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        explain();
      }
    });

    // ── Helpers ──────────────────────────────────────────────────────────────

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    /**
     * Minimal Markdown → HTML renderer.
     * Handles: fenced code blocks, inline code, **bold**, paragraph breaks.
     */
    function md(raw) {
      // Split on fenced code blocks; odd-indexed parts are the code contents
      var parts = raw.split(/```(?:\w+)?\n?([\s\S]*?)```/);
      var html = '';

      parts.forEach(function (part, i) {
        if (i % 2 === 1) {
          // Code block
          html += '<pre><code>' + esc(part.trimEnd()) + '</code></pre>';
        } else {
          // Regular text – escape, then apply inline formatting
          var t = esc(part);
          // Inline code
          t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
          // Bold (**text**)
          t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
          // Paragraphs (double newline) → <p>, single newline → <br>
          t.split(/\n\n+/).forEach(function (p) {
            var trimmed = p.trim();
            if (trimmed) {
              html += '<p>' + trimmed.replace(/\n/g, '<br>') + '</p>';
            }
          });
        }
      });

      return html;
    }
  </script>

</body>
</html>
